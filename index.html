<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ping Pong</title>
  <meta name="description" content="A one-file ping pong game you can play inside an X post." />

  <!--
    Hosted at https://xyzzyapps.github.io/ping-pong/
    X reads these tags and, on desktop, loads the page in the timeline as a Player Card.
    The domain usually has to pass the card validator at https://cards-dev.x.com/validator
    before the embed shows up. Do not set X-Frame-Options or a CSP that blocks x.com.
  -->
  <meta name="twitter:card" content="player" />
  <meta name="twitter:title" content="Ping Pong" />
  <meta name="twitter:description" content="Move the left paddle. First to 7." />
  <meta name="twitter:image" content="https://xyzzyapps.github.io/ping-pong/preview.png" />
  <meta name="twitter:player" content="https://xyzzyapps.github.io/ping-pong/" />
  <meta name="twitter:player:width" content="480" />
  <meta name="twitter:player:height" content="480" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }
  </style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<script>
(function () {
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 480;
  var H = 480;

  var paddleW = 10;
  var paddleH = 64;
  var ballS = 8;
  var winScore = 7;
  var serveSpeed = 1.7;
  var maxSpeed = 3.4;

  var playerY = (H - paddleH) / 2;
  var cpuY = playerY;
  var ballX = W / 2 - ballS / 2;
  var ballY = H / 2 - ballS / 2;
  var ballVX = 0;
  var ballVY = 0;
  var playerScore = 0;
  var cpuScore = 0;
  var started = false;
  var over = false;
  var pointerY = H / 2;
  var audioCtx = null;

  function unlockAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, duration, gain, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var amp = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t);
    amp.gain.setValueAtTime(gain, t);
    amp.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(amp);
    amp.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  function resetBall(dir) {
    ballX = W / 2 - ballS / 2;
    ballY = H / 2 - ballS / 2;
    var speed = Math.min(serveSpeed + (playerScore + cpuScore) * 0.08, maxSpeed);
    ballVX = dir * speed;
    ballVY = (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.7);
  }

  function serve(dir) {
    over = false;
    started = true;
    resetBall(dir);
  }

  function point(scorer) {
    if (scorer === "player") playerScore += 1;
    else cpuScore += 1;
    started = false;
    ballVX = 0;
    ballVY = 0;
    ballX = W / 2 - ballS / 2;
    ballY = H / 2 - ballS / 2;
    if (playerScore >= winScore || cpuScore >= winScore) {
      over = true;
      tone(140, 0.16, 0.08);
      tone(90, 0.22, 0.08, 0.16);
    } else {
      tone(110, 0.12, 0.07);
    }
  }

  function step() {
    if (!started || over) return;

    var cpuTarget = ballY + ballS / 2 - paddleH / 2;
    var cpuStep = Math.max(-1.55, Math.min(1.55, cpuTarget - cpuY));
    cpuY += cpuStep;
    if (cpuY < 16) cpuY = 16;
    if (cpuY > H - paddleH - 16) cpuY = H - paddleH - 16;

    var playerTarget = pointerY - paddleH / 2;
    var playerStep = Math.max(-3.2, Math.min(3.2, playerTarget - playerY));
    playerY += playerStep;
    if (playerY < 16) playerY = 16;
    if (playerY > H - paddleH - 16) playerY = H - paddleH - 16;

    ballX += ballVX;
    ballY += ballVY;

    if (ballY < 16) {
      ballY = 16;
      ballVY *= -1;
      tone(520, 0.04, 0.05);
    } else if (ballY > H - 16 - ballS) {
      ballY = H - 16 - ballS;
      ballVY *= -1;
      tone(520, 0.04, 0.05);
    }

    function bounce(paddleTop, goingLeft) {
      var center = ballY + ballS / 2 - (paddleTop + paddleH / 2);
      var hit = center / (paddleH / 2);
      var next = Math.min(Math.abs(ballVX) * 1.05 + 0.08, maxSpeed);
      ballVX = (goingLeft ? -1 : 1) * next;
      ballVY = hit * 2.1;
      tone(goingLeft ? 240 : 180, 0.06, 0.08);
    }

    var left = 36;
    if (ballVX < 0 && ballX <= left + paddleW && ballX + ballS >= left &&
        ballY + ballS > playerY && ballY < playerY + paddleH) {
      ballX = left + paddleW;
      bounce(playerY, false);
    }

    var right = W - 36 - paddleW;
    if (ballVX > 0 && ballX + ballS >= right && ballX <= right + paddleW &&
        ballY + ballS > cpuY && ballY < cpuY + paddleH) {
      ballX = right - ballS;
      bounce(cpuY, true);
    }

    if (ballX < -20) point("cpu");
    else if (ballX > W + 20) point("player");
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff";
    var dash = 14;
    var gap = 12;
    for (var y = 24; y < H - 16; y += dash + gap) {
      ctx.fillRect(W / 2 - 2, y, 4, dash);
    }

    ctx.fillRect(36, playerY, paddleW, paddleH);
    ctx.fillRect(W - 36 - paddleW, cpuY, paddleW, paddleH);
    ctx.fillRect(ballX, ballY, ballS, ballS);

    ctx.font = "42px ui-monospace, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText(String(playerScore), W / 2 - 56, 58);
    ctx.fillText(String(cpuScore), W / 2 + 56, 58);

    ctx.font = "13px ui-monospace, Consolas, monospace";
    if (!started && !over) {
      ctx.fillText("click or press space", W / 2, H / 2 + 48);
    } else if (over) {
      var msg = playerScore > cpuScore ? "you win" : "cpu wins";
      ctx.fillText(msg + "  ·  click to play again", W / 2, H / 2 + 48);
    }
  }

  function frame() {
    step();
    draw();
    requestAnimationFrame(frame);
  }

  function setPointer(clientY) {
    var rect = canvas.getBoundingClientRect();
    pointerY = (clientY - rect.top) * (H / rect.height);
  }

  canvas.addEventListener("pointermove", function (e) {
    setPointer(e.clientY);
  });
  canvas.addEventListener("pointerdown", function (e) {
    setPointer(e.clientY);
    if (over) {
      playerScore = 0;
      cpuScore = 0;
    }
    if (!started) {
      unlockAudio();
      serve(Math.random() < 0.5 ? -1 : 1);
      tone(330, 0.05, 0.05);
    }
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp") pointerY -= 22;
    else if (e.key === "ArrowDown") pointerY += 22;
    else if (e.code === "Space") {
      e.preventDefault();
      if (over) {
        playerScore = 0;
        cpuScore = 0;
      }
      if (!started) {
        unlockAudio();
        serve(-1);
        tone(330, 0.05, 0.05);
      }
    }
  });

  frame();
})();
</script>
</body>
</html>
